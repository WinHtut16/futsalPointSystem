  <path id="wave-2" d="M28 58 q7 -6 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="wave-3" d="M28 72 q7 -6 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
