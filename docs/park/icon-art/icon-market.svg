<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Artboard Market, 112 x 112. Idle: string lights glow one after another.
       Hover: awning flaps (scale-y 1 to 1.08 and back), a puff of steam from the pot. -->
  <circle id="chip" cx="56" cy="56" r="56" fill="#FFCB47"/>
  <g id="lights">
    <path id="light-string" d="M24 30 Q56 42 88 30" fill="none" stroke="#12302A" stroke-width="2"/>
    <circle id="light-1" cx="36" cy="34" r="3.5" fill="#FFFFFF"/>
    <circle id="light-2" cx="56" cy="37" r="3.5" fill="#FFFFFF"/>
    <circle id="light-3" cx="76" cy="34" r="3.5" fill="#FFFFFF"/>
  </g>
  <g id="awning">
    <path id="awning-body" d="M28 46 H84 L80 56 H32 Z" fill="#12302A"/>
    <path id="awning-scallop" d="M32 56 q4 6 8 0 q4 6 8 0 q4 6 8 0 q4 6 8 0 q4 6 8 0 q4 6 8 0" fill="#12302A"/>
  </g>
  <g id="stall">
    <path id="stall-counter" d="M34 66 H78 V82 H34 Z" fill="#12302A"/>
    <path id="pot" d="M48 62 H64 V68 H48 Z" fill="#F6ECE6"/>
    <path id="pot-steam" d="M56 60 c-3 -3 3 -5 0 -8" fill="none" stroke="#12302A" stroke-width="2.5" stroke-linecap="round" opacity="0"/>
  </g>
</svg>
