<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- Artboard Futsal, 112 x 112. Idle: ball turns slowly (6 s, linear).
       Hover: ball bounces with squash on impact; shadow scales with height. -->
  <circle id="chip" cx="56" cy="56" r="56" fill="#0B4327"/>
  <ellipse id="shadow" cx="56" cy="82" rx="16" ry="4" fill="#000000" opacity="0.25"/>
  <g id="ball">
    <circle id="ball-body" cx="56" cy="54" r="22" fill="#FFFFFF"/>
    <path id="ball-patch" d="M56 45 L64 51 L61 61 L51 61 L48 51 Z" fill="#12302A"/>
    <path id="ball-seams" d="M56 45 V34 M64 51 L75 47 M61 61 L68 71 M51 61 L44 71 M48 51 L37 47" stroke="#12302A" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
